<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HTML + CSS</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="nav">
      <div class="box">
        <img src="images/logo.png" alt="a white book logo"/> 
        <a>Browse Stock</a>
      </div>
    </div>
    <div class="hero">
      <h1>Your Next Adventure Awaits</h1>
      <div class="click">
        <button data-modal-target="#modal">Shop Now</button>
      </div>
      <img class="wave" src="images/wave.png" alt="a wave graphic"/>
      <div class="carousel">
        <div class="group">
          <div class="book"><img src="images/book-1.png" alt="Sense and Sensibility"/></div>
          <div class="book"><img src="images/book-2.png" alt="Bridgerton"/></div>
          <div class="book"><img src="images/book-3.png" alt="Nineteen Eighty-Four"/></div>
          <div class="book"><img src="images/book-4.png" alt="Wuthering Heights"/></div>
          <div class="book"><img src="images/book-5.png" alt="Grimm's Fairy Tales"/></div>
          <div class="book"><img src="images/book-6.png" alt="Bridgerton"/></div>
          <div class="book"><img src="images/book-7.png" alt="The Hound of the Baskervilles"/></div>
          <div class="book"><img src="images/book-8.png" alt="Emma"/></div>
        </div>
        <div aria-hidden="true" class="group">
          <div class="book"><img src="images/book-1.png" alt="Sense and Sensibility"/></div>
          <div class="book"><img src="images/book-2.png" alt="Bridgerton"/></div>
          <div class="book"><img src="images/book-3.png" alt="Nineteen Eighty-Four"/></div>
          <div class="book"><img src="images/book-4.png" alt="Wuthering Heights"/></div>
          <div class="book"><img src="images/book-5.png" alt="Grimm's Fairy Tales"/></div>
          <div class="book"><img src="images/book-6.png" alt="Bridgerton"/></div>
          <div class="book"><img src="images/book-7.png" alt="The Hound of the Baskervilles"/></div>
          <div class="book"><img src="images/book-8.png" alt="Emma"/></div>
        </div>
      </div>
    </div>
    <div class="modal" id="modal">
      <button data-close-button class="close-button">&times;</button>
      <h2>Spin The Wheel For a Mystery Deal</h2>
      <p>Win Up to 30% Off</p>
      <div class="glowbutton">
        <a>Play Now
          <div class="glowmask">
           <div class="glowborder"></div>
          </div>
        </a>
      </div>
    </div>
    <div id="overlay"></div>
  </body>
</html>
